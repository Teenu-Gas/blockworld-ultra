name: Build Block World Ultra APK

on:
  workflow_dispatch:
  push:
    paths:
      - "blockworld-ultra/**"
      - ".github/workflows/blockworld-ultra-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockworld-ultra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlockWorldUltra.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorldUltra.apk
          path: blockworld-ultra/BlockWorldUltra.apk
